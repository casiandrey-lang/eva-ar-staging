<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gardecor EVA · Resetare parolă</title>
<style>
html,body{margin:0;min-height:100%;background:#f3f5f7;color:#111827;font-family:system-ui,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,460px);background:#fff;border:1px solid #dfe4ea;border-radius:18px;padding:28px;box-shadow:0 18px 50px #11182712}.brand{font-weight:900;letter-spacing:.08em;color:#1f4e79}.sub{font-size:13px;color:#667085;line-height:1.5;margin:8px 0 22px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{font:inherit;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;outline:none}.field input:focus{border-color:#1f4e79;box-shadow:0 0 0 3px #1f4e7915}button{width:100%;border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;background:#1f4e79;color:#fff}.msg{min-height:20px;margin-top:14px;font-size:12px;line-height:1.45}.ok{color:#17643a}.bad{color:#a12b2b}.muted{font-size:11px;color:#7a8492;margin-top:18px;line-height:1.45}#changeBox{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">GARDECOR · EVA</div>
  <h1 style="font-size:24px;margin:8px 0 0">Resetare parolă</h1>
  <p class="sub">Pagina este destinată conturilor EVA. Parola nouă este transmisă direct către Supabase Auth prin conexiune HTTPS.</p>

  <div id="requestBox">
    <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" value="andy2count@gmail.com"></div>
    <button id="send">Trimite linkul de resetare</button>
  </div>

  <div id="changeBox">
    <div class="field"><label for="p1">Parolă nouă</label><input id="p1" type="password" autocomplete="new-password" minlength="8"></div>
    <div class="field"><label for="p2">Confirmă parola</label><input id="p2" type="password" autocomplete="new-password" minlength="8"></div>
    <button id="save">Salvează parola nouă</button>
  </div>

  <div id="msg" class="msg"></div>
  <div class="muted">Nu introduce parola în ChatGPT sau în alte mesaje. După schimbare, folosește noua parolă în Draft9.16.</div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://xjzlxenbfqhxvhpyxxmc.supabase.co';
const SUPABASE_KEY='sb_publishable_BrgsQmk938NZNcSKLWwAag_5bohvlzl';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id), msg=$('msg'), requestBox=$('requestBox'), changeBox=$('changeBox');
const show=(text,ok=false)=>{msg.textContent=text;msg.className='msg '+(ok?'ok':'bad')};
async function showRecovery(){
  const {data:{session}}=await supabase.auth.getSession();
  if(session){requestBox.style.display='none';changeBox.style.display='block';show('Link valid. Introdu parola nouă.',true)}
}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){requestBox.style.display='none';changeBox.style.display='block';show('Link valid. Introdu parola nouă.',true)}});
$('send').onclick=async()=>{
  const email=$('email').value.trim(); if(!email){show('Introdu adresa de e-mail.');return}
  $('send').disabled=true; show('Se trimite…',true);
  const redirectTo=location.origin+location.pathname;
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
  $('send').disabled=false;
  if(error){show('Nu s-a putut trimite: '+error.message);return}
  show('Mesajul de resetare a fost trimis. Verifică Inbox și Spam. Deschide linkul din acel e-mail pe acest dispozitiv.',true);
};
$('save').onclick=async()=>{
  const p1=$('p1').value,p2=$('p2').value;
  if(p1.length<8){show('Parola trebuie să aibă minimum 8 caractere.');return}
  if(p1!==p2){show('Parolele nu coincid.');return}
  $('save').disabled=true; show('Se salvează…',true);
  const {error}=await supabase.auth.updateUser({password:p1});
  $('save').disabled=false;
  if(error){show('Parola nu a fost schimbată: '+error.message);return}
  await supabase.auth.signOut();
  requestBox.style.display='block';changeBox.style.display='none';$('p1').value='';$('p2').value='';
  show('Parola a fost schimbată. Poți reveni în EVA Draft9.16 și te poți autentifica.',true);
};
showRecovery();
</script>
</body>
</html>
