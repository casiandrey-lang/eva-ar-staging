<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>EVA P0.4 — WebXR control</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    #top{position:fixed;left:0;right:0;top:0;z-index:20;padding:10px 12px;background:#151515e8;backdrop-filter:blur(7px)}
    #top strong{display:block;font-size:16px}.muted{font-size:11px;color:#bbb;margin-top:2px}
    #status{margin-top:6px;font-size:12px;color:#d8d8d8}
    #start{margin-top:8px;border:0;border-radius:10px;padding:12px 16px;font-weight:750;background:#fff;color:#111}
    #start:disabled{opacity:.45}
    #controls{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(96%,760px);display:none;gap:6px;padding:8px;border-radius:14px;background:#111e;backdrop-filter:blur(8px)}
    #controls.active{display:grid}
    .row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
    button.ctrl{border:1px solid #ffffff35;border-radius:9px;padding:10px 11px;background:#222;color:#fff;font-weight:700;font-size:12px}
    button.ctrl.primary{background:#fff;color:#111}
    button.ctrl.warn{background:#392d16}
    button.ctrl:disabled{opacity:.45}
    #hint{font-size:10px;color:#bbb;text-align:center;line-height:1.25}
    #wallInfo{font-size:11px;color:#ddd;text-align:center}
  </style>
  <script>
    window.addEventListener('error', function(e) {
      var s=document.getElementById('status');
      if(s) s.textContent='Eroare startup: '+(e.message||'necunoscută');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var s=document.getElementById('status');
      if(s) s.textContent='Eroare async: '+(e.reason && (e.reason.message||e.reason) || 'necunoscută');
    });
  </script>
</head>
<body>
<div id="app"></div>
<div id="top">
  <strong>EVA P0.4.1 — WebXR control direct</strong>
  <div class="muted">Test 1:1. Peretele se definește prin două puncte la baza lui.</div>
  <div id="status">Pornire modul P0.4.1…</div>
  <button id="start" disabled>Pornește WebXR P0.4.1</button>
</div>
<div id="controls">
  <div class="row">
    <button id="horizon" class="ctrl primary">Orizont</button>
    <button id="flip" class="ctrl">Față / Spate</button>
    <button id="left" class="ctrl">↶ 15°</button>
    <button id="right" class="ctrl">15° ↷</button>
    <button id="replace" class="ctrl">Reașază</button>
  </div>
  <div class="row">
    <button id="defineWall" class="ctrl warn">Definește peretele</button>
    <button id="snapWall" class="ctrl primary" disabled>Lipește de perete</button>
  </div>
  <div id="wallInfo">Perete: nedefinit</div>
  <div id="hint">Reașază: apasă butonul, apoi atinge pardoseala. Perete: apasă „Definește peretele”, apoi atinge două puncte la baza peretelui.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.getElementById('app');
const status=document.getElementById('status');
const start=document.getElementById('start');
const controls=document.getElementById('controls');
const wallInfo=document.getElementById('wallInfo');
const snapWall=document.getElementById('snapWall');

let renderer,scene,camera,session,refSpace,viewerSpace,hitTestSource;
let reticle,model=null;
let mode='place';
let wallPoints=[];
let yaw=0;
const WIDTH=8.5;

function setStatus(t){status.textContent=t;}

function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera();
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  app.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.0));
  const dl=new THREE.DirectionalLight(0xffffff,2.0); dl.position.set(2,5,2); scene.add(dl);

  const geo=new THREE.RingGeometry(0.10,0.13,32).rotateX(-Math.PI/2);
  reticle=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffffff}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  const loader=new GLTFLoader();
  loader.load('./models/eva-p0-8500w-5000p.glb',g=>{
    model=g.scene;
    model.visible=false;
    model.rotation.order='YXZ';
    scene.add(model);
    setStatus('Model încărcat. Verific WebXR…');
  },undefined,e=>setStatus('Eroare GLB: '+(e?.message||e)));
}

async function checkXR(){
  try{
    if(!navigator.xr){setStatus('navigator.xr: NU');start.disabled=true;return;}
    const ok=await navigator.xr.isSessionSupported('immersive-ar');
    setStatus('WebXR immersive-ar: '+(ok?'DA — gata de pornire':'NU'));
    start.disabled=!ok;
  }catch(e){
    setStatus('Eroare verificare WebXR: '+(e?.message||e));
    start.disabled=true;
  }
}

function applyYaw(next){
  yaw=((next%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  if(model){model.rotation.x=0;model.rotation.z=0;model.rotation.y=yaw;}
}

function matrixPosition(mat){
  const p=new THREE.Vector3(); p.setFromMatrixPosition(mat); return p;
}

function placeAtReticle(){
  if(!model||!reticle.visible)return;
  const p=matrixPosition(reticle.matrix);
  model.position.copy(p);
  model.position.y=p.y;
  model.rotation.x=0;model.rotation.z=0;
  model.visible=true;
  mode='idle';
  setStatus('Pergola plasată. Controalele sunt active în WebXR.');
}

function onSelect(){
  if(!reticle.visible)return;
  if(mode==='place'){placeAtReticle();return;}
  if(mode==='wall'){
    const p=matrixPosition(reticle.matrix);
    wallPoints.push(p.clone());
    if(wallPoints.length===1){
      wallInfo.textContent='Perete: punct 1 setat — selectează punctul 2';
      setStatus('Punct 1 perete setat. Atinge al doilea punct la baza aceluiași perete.');
    }else{
      mode='idle';
      const a=wallPoints[0],b=wallPoints[1];
      const dx=b.x-a.x,dz=b.z-a.z;
      const len=Math.hypot(dx,dz);
      if(len<0.35){wallPoints=[];wallInfo.textContent='Perete: puncte prea apropiate';snapWall.disabled=true;setStatus('Repetă: punctele peretelui sunt prea apropiate.');return;}
      const deg=Math.atan2(dz,dx)*180/Math.PI;
      wallInfo.textContent=`Perete definit: ${len.toFixed(2)} m, direcție ${deg.toFixed(1)}°`;
      snapWall.disabled=false;
      setStatus('Perete definit. Apasă „Lipește de perete”.');
    }
  }
}

function snapToWall(){
  if(!model||wallPoints.length!==2)return;
  const a=wallPoints[0],b=wallPoints[1];
  const dx=b.x-a.x,dz=b.z-a.z;
  const len=Math.hypot(dx,dz); if(!len)return;
  const ux=dx/len, uz=dz/len;
  const targetYaw=Math.atan2(-uz,ux);
  applyYaw(targetYaw);
  const mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
  model.position.x=mx-ux*(WIDTH/2);
  model.position.z=mz-uz*(WIDTH/2);
  model.position.y=(a.y+b.y)/2;
  model.visible=true;
  setStatus('Wall Snap aplicat. Dacă proiecția este pe partea greșită, apasă Față / Spate.');
}

async function startXR(){
  start.disabled=true;
  setStatus('Se solicită sesiunea WebXR…');
  try{
    session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test','local-floor'],
      optionalFeatures:['dom-overlay'],
      domOverlay:{root:document.body}
    });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
    refSpace=await session.requestReferenceSpace('local-floor');
    viewerSpace=await session.requestReferenceSpace('viewer');
    hitTestSource=await session.requestHitTestSource({space:viewerSpace});
    session.addEventListener('select',onSelect);
    session.addEventListener('end',()=>{
      controls.classList.remove('active');
      start.style.display='inline-block';
      start.disabled=false;
      setStatus('Sesiune WebXR închisă.');
    });
    controls.classList.add('active');
    start.style.display='none';
    mode=model?.visible?'idle':'place';
    const overlay=session.domOverlayState?.type||'indisponibil';
    setStatus('WebXR pornit. DOM overlay: '+overlay+'. '+(mode==='place'?'Atinge pardoseala pentru plasare.':'Model activ.'));
    renderer.setAnimationLoop(render);
  }catch(e){
    setStatus('WebXR start eșuat: '+(e?.name||'Error')+' — '+(e?.message||e));
    start.disabled=false;
  }
}

function render(_t,frame){
  if(frame&&hitTestSource&&refSpace){
    const hits=frame.getHitTestResults(hitTestSource);
    if(hits.length){
      const pose=hits[0].getPose(refSpace);
      reticle.visible=true;
      reticle.matrix.fromArray(pose.transform.matrix);
    }else reticle.visible=false;
  }
  renderer.render(scene,camera);
}

start.addEventListener('click',startXR);
document.getElementById('horizon').addEventListener('click',()=>{if(model){model.rotation.x=0;model.rotation.z=0;setStatus('Orizont aplicat: stâlpi verticali, stofă sus.');}});
document.getElementById('flip').addEventListener('click',()=>{applyYaw(yaw+Math.PI);setStatus('Față / Spate inversat 180°.');});
document.getElementById('left').addEventListener('click',()=>applyYaw(yaw+THREE.MathUtils.degToRad(15)));
document.getElementById('right').addEventListener('click',()=>applyYaw(yaw-THREE.MathUtils.degToRad(15)));
document.getElementById('replace').addEventListener('click',()=>{mode='place';setStatus('Reașezare activă: atinge noul punct pe pardoseală.');});
document.getElementById('defineWall').addEventListener('click',()=>{wallPoints=[];snapWall.disabled=true;mode='wall';wallInfo.textContent='Perete: selectează punctul 1';setStatus('Definește peretele: atinge primul punct la baza peretelui.');});
snapWall.addEventListener('click',snapToWall);

addEventListener('resize',()=>{if(renderer)renderer.setSize(innerWidth,innerHeight);});
setStatus('Module Three.js încărcate. Inițializare scenă…');
initScene();
checkXR();
</script>
</body>
</html>
