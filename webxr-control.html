<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>EVA P0.8 — Compact AR UI</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;left:6px;right:6px;top:max(5px,env(safe-area-inset-top));z-index:20;padding:5px 7px;border-radius:10px;background:#111c;backdrop-filter:blur(7px);box-shadow:0 1px 7px #0008}
#topLine{display:flex;align-items:center;gap:6px}#top strong{font-size:12px;white-space:nowrap}#status{flex:1;min-width:0;font-size:10px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#chips{display:flex;gap:5px;margin-top:3px;overflow:hidden}.chip{font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;background:#222d;white-space:nowrap}.good{color:#76e49a}.warn{color:#ffc46c}#target.ok,#lock.ok{color:#76e49a}
#start{margin-left:auto;border:0;border-radius:8px;padding:7px 10px;font-weight:800;background:#fff;color:#111;font-size:11px}#start:disabled{opacity:.45}
#controls{position:fixed;left:50%;bottom:max(5px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(96%,680px);display:none;gap:5px;padding:6px;border-radius:14px;background:#111d;backdrop-filter:blur(8px);box-shadow:0 2px 12px #0009}#controls.active{display:grid}
.row{display:flex;gap:4px;justify-content:center;align-items:center}button.ctrl{border:1px solid #ffffff38;border-radius:9px;padding:8px 9px;background:#222e;color:#fff;font-weight:750;font-size:11px;min-height:38px}button.ctrl.primary{background:#fff;color:#111}#mainRow button{flex:1;min-width:0;padding-left:5px;padding-right:5px}#moreToggle.open{background:#fff;color:#111}
#wallAction{width:100%;border:2px solid #fff;border-radius:11px;padding:11px 9px;background:#fff;color:#111;font-size:14px;font-weight:900;min-height:44px}#wallInfo{font-size:9px;color:#ddd;text-align:center;font-weight:700;min-height:11px}
#morePanel{display:none;gap:5px;max-height:31vh;overflow:auto;padding:5px;border:1px solid #ffffff2c;border-radius:10px;background:#171717e8}#morePanel.open{display:grid}.section{display:grid;gap:4px}.sectionTitle{font-size:9px;font-weight:800;color:#bbb;text-align:center}.compactRow{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.compactRow button{padding:6px 3px;min-height:34px;font-size:10px}.twoRow{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.threeRow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.rangeRow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:5px;font-size:9px}.rangeRow input{width:100%}#heightInfo,#fabricInfo{font-size:9px;color:#ccc;text-align:center}
#hint{display:none}
</style>
<script>window.addEventListener('error',e=>{const s=document.getElementById('status');if(s)s.textContent='Eroare: '+(e.message||'necunoscută')});window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('status');if(s)s.textContent='Eroare async: '+(e.reason?.message||e.reason||'necunoscută')});</script>
</head>
<body>
<div id="app"></div>
<div id="top">
  <div id="topLine"><strong>EVA 3,5 × 2,0 · P0.8</strong><div id="status">Pornire…</div><button id="start" disabled>WebXR</button></div>
  <div id="chips"><span id="floor" class="chip warn">Sol: —</span><span id="target" class="chip warn">Țintă: —</span><span id="lock" class="chip warn">Lock: NU</span></div>
</div>
<div id="controls">
  <div id="mainRow" class="row">
    <button id="horizon" class="ctrl primary">Orizont</button>
    <button id="flip" class="ctrl">Față/Spate</button>
    <button id="replace" class="ctrl">Reașază</button>
    <button id="moreToggle" class="ctrl">Mai mult ▴</button>
  </div>
  <button id="wallAction">1. Definește peretele</button>
  <div id="wallInfo">Perete: nedefinit</div>
  <div id="morePanel">
    <div class="section"><div class="sectionTitle">Poziție fină · 5 cm / 5°</div><div class="compactRow">
      <button id="moveLeft" class="ctrl">←</button><button id="moveForward" class="ctrl">↑</button><button id="moveBack" class="ctrl">↓</button><button id="moveRight" class="ctrl">→</button><button id="fineLeft" class="ctrl">↶5°</button><button id="fineRight" class="ctrl">5°↷</button>
    </div><div class="twoRow"><button id="coarseLeft" class="ctrl">↶ 15°</button><button id="coarseRight" class="ctrl">15° ↷</button></div></div>
    <div class="section"><div class="sectionTitle">Înălțime</div><div class="twoRow"><button id="heightDown" class="ctrl">H −5 cm</button><button id="heightUp" class="ctrl">H +5 cm</button></div><div id="heightInfo">H spate 2.85 m · H față 2.60 m</div></div>
    <div class="section"><div class="sectionTitle">Stofă · profile · LED</div><div class="rangeRow"><span>0%</span><input id="fabricRange" type="range" min="0" max="100" step="5" value="100"><span>100%</span></div><div class="threeRow"><button id="fabricClose" class="ctrl">Stofă 0%</button><button id="fabricOpen" class="ctrl">Stofă 100%</button><button id="ledToggle" class="ctrl primary">LED ON</button></div><div id="fabricInfo">Stofă 100% · 6 profile · LED ON</div></div>
  </div>
  <div id="hint"></div>
</div>
<script type="module">
import * as THREE from 'three';
const app=document.getElementById('app'),status=document.getElementById('status'),floorLabel=document.getElementById('floor'),target=document.getElementById('target'),lockLabel=document.getElementById('lock'),start=document.getElementById('start'),controls=document.getElementById('controls'),wallInfo=document.getElementById('wallInfo'),wallAction=document.getElementById('wallAction'),heightInfo=document.getElementById('heightInfo'),fabricInfo=document.getElementById('fabricInfo'),fabricRange=document.getElementById('fabricRange'),ledToggle=document.getElementById('ledToggle'),morePanel=document.getElementById('morePanel'),moreToggle=document.getElementById('moreToggle');
let renderer,scene,camera,session,refSpace,viewerSpace,hitTestSource,reticle,model=null,latestFrame=null,modelAnchor=null;
let mode='place',wallPoints=[],wallMarkers=[],wallLine=null,currentFloorTarget=null,lastStableFloorTarget=null,lastFloorTargetTime=0,yaw=0,wallStage=0,floorLocked=false,floorY=0;
let lockedToWorld=false,pendingAnchorRefresh=false,anchorRefreshInFlight=false,anchorSuspended=false,anchorStatus='';
let rearH=2.85,frontH=2.60,heightOffset=0,fabricPct=100,ledOn=true;
const WIDTH=3.5,PROJECTION=2.0,BASE_REAR_H=2.85,BASE_FRONT_H=2.60,MOVE_STEP=.05,HEIGHT_STEP=.05,FINE_ROTATE_STEP=THREE.MathUtils.degToRad(5),TARGET_GRACE_MS=1400,MAX_TARGET_DISTANCE=15;
const refs={};
function setStatus(t){status.textContent=t}
function normalizeRad(v){return((v%(Math.PI*2))+(Math.PI*2))%(Math.PI*2)}
function setFloorLabel(){floorLabel.textContent=floorLocked?'Sol: BLOCAT ✓':'Sol: —';floorLabel.classList.toggle('good',floorLocked);floorLabel.classList.toggle('warn',!floorLocked)}
function setLockLabel(){lockLabel.textContent=lockedToWorld?'Lock: DA ✓':'Lock: NU';lockLabel.classList.toggle('ok',lockedToWorld);lockLabel.classList.toggle('warn',!lockedToWorld)}
function setTarget(ok,d=null){if(lockedToWorld){target.textContent='Țintă: —';target.classList.remove('ok');return}target.textContent=ok?`Țintă: OK${d!==null?' '+d.toFixed(1)+'m':''}`:'Țintă: —';target.classList.toggle('ok',ok)}
function setWallStage(s){wallStage=s;wallAction.textContent=s===0?'1. Definește peretele':s===1?'2. Setează P1':s===2?'3. Setează P2':s===3?'4. Lipește + blochează':'Redefinește peretele'}
function closeMore(){morePanel.classList.remove('open');moreToggle.classList.remove('open');moreToggle.textContent='Mai mult ▴'}
function toggleMore(){const open=morePanel.classList.toggle('open');moreToggle.classList.toggle('open',open);moreToggle.textContent=open?'Închide ▾':'Mai mult ▴'}
function box(group,name,size,pos,material,rotX=0){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),material);m.name=name;m.position.set(...pos);m.rotation.x=rotX;group.add(m);return m}
function clearModelChildren(){while(model.children.length){const c=model.children.pop();c.geometry?.dispose?.();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose?.());else c.material.dispose?.()}}Object.keys(refs).forEach(k=>delete refs[k])}
function buildModelGeometry(){if(!model)return;clearModelChildren();rearH=BASE_REAR_H+heightOffset;frontH=BASE_FRONT_H+heightOffset;const metal=new THREE.MeshStandardMaterial({color:0xc6c9cc,metalness:.52,roughness:.35}),fabricMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,side:THREE.DoubleSide}),profileMat=new THREE.MeshStandardMaterial({color:0xbfc3c7,metalness:.48,roughness:.38}),ledMat=new THREE.MeshStandardMaterial({color:0xfff7dc,emissive:ledOn?0xfff1b8:0x000000,emissiveIntensity:ledOn?4:0,roughness:.3});const drop=rearH-frontH,slope=Math.atan2(drop,PROJECTION),midH=(rearH+frontH)/2,railLen=Math.hypot(PROJECTION,drop);
refs.rear=box(model,'rear_beam',[WIDTH,.18,.14],[WIDTH/2,rearH-.09,.07],metal);refs.front=box(model,'front_gutter',[WIDTH,.20,.16],[WIDTH/2,frontH-.10,PROJECTION-.08],metal);refs.colL=box(model,'front_column_left',[.12,frontH-.10,.12],[.06,(frontH-.10)/2,PROJECTION-.08],metal);refs.colR=box(model,'front_column_right',[.12,frontH-.10,.12],[WIDTH-.06,(frontH-.10)/2,PROJECTION-.08],metal);refs.railL=box(model,'rail_left',[.10,.10,railLen],[.07,midH-.10,PROJECTION/2],metal,slope);refs.railR=box(model,'rail_right',[.10,.10,railLen],[WIDTH-.07,midH-.10,PROJECTION/2],metal,slope);
const f=Math.max(.04,fabricPct/100),visP=(PROJECTION-.20)*f,visDrop=drop*(visP/PROJECTION),visRail=Math.hypot(visP,visDrop),z0=.10,zMid=z0+visP/2,yMid=rearH-.16-visDrop/2;refs.fabric=box(model,'fabric',[WIDTH-.24,.025,Math.max(.10,visRail)],[WIDTH/2,yMid,zMid],fabricMat,slope);
refs.fabricProfiles=[];refs.ledStrips=[];const n=6,travel=PROJECTION-.26;for(let i=0;i<n;i++){let z;if(fabricPct<=5)z=.16+i*.035;else z=.16+(travel*(i/(n-1)))*(fabricPct/100);z=Math.min(PROJECTION-.12,z);const y=rearH-.205-drop*(z/PROJECTION);const p=box(model,'fabric_profile_'+i,[WIDTH-.18,.045,.055],[WIDTH/2,y,z],profileMat,slope);const l=box(model,'led_'+i,[WIDTH-.30,.010,.020],[WIDTH/2,y-.031,z+.006],ledMat,slope);refs.fabricProfiles.push(p);refs.ledStrips.push(l)}
heightInfo.textContent=`H spate ${rearH.toFixed(2)} m · H față ${frontH.toFixed(2)} m`;fabricInfo.textContent=`Stofă ${fabricPct}% · ${refs.fabricProfiles.length} profile · LED ${ledOn?'ON':'OFF'}`;ledToggle.textContent=ledOn?'LED ON':'LED OFF';ledToggle.classList.toggle('primary',ledOn)}
function createModel(){model=new THREE.Group();model.name='EVA_3500x2000_P08';model.rotation.order='YXZ';model.visible=false;scene.add(model);buildModelGeometry()}
function initScene(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera();renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;app.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(2,5,2);scene.add(dl);reticle=new THREE.Mesh(new THREE.RingGeometry(.075,.12,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,depthTest:false}));reticle.visible=false;reticle.renderOrder=999;scene.add(reticle);createModel();setStatus('Model pregătit. Verific WebXR…')}
async function checkXR(){try{if(!navigator.xr){setStatus('navigator.xr indisponibil');return}const ok=await navigator.xr.isSessionSupported('immersive-ar');setStatus(ok?'WebXR gata':'WebXR indisponibil');start.disabled=!ok}catch(e){setStatus('Eroare WebXR: '+(e?.message||e))}}
function applyYaw(v){yaw=normalizeRad(v);if(model&&!lockedToWorld){model.rotation.set(0,yaw,0);model.position.y=floorY}else if(model&&lockedToWorld){model.rotation.set(0,yaw,0);model.position.y=floorY;scheduleRelock()}}
function worldMove(localRight,localForward){if(!model?.visible){setStatus('Plasează mai întâi pergola.');return}const rx=Math.cos(yaw),rz=-Math.sin(yaw),fx=Math.sin(yaw),fz=Math.cos(yaw);model.position.x+=rx*localRight+fx*localForward;model.position.z+=rz*localRight+fz*localForward;model.position.y=floorY;if(lockedToWorld)scheduleRelock();setStatus('Reglaj fin aplicat.')}
function currentStableFloorTarget(){if(currentFloorTarget)return currentFloorTarget.clone();if(lastStableFloorTarget&&(performance.now()-lastFloorTargetTime)<TARGET_GRACE_MS)return lastStableFloorTarget.clone();return null}
function updateFloorTarget(frame){if(lockedToWorld){reticle.visible=false;currentFloorTarget=null;setTarget(false);return}if(!floorLocked||!refSpace){currentFloorTarget=null;reticle.visible=false;setTarget(false);return}const pose=frame.getViewerPose(refSpace);if(!pose||!pose.views.length)return;const t=pose.views[0].transform,origin=new THREE.Vector3(t.position.x,t.position.y,t.position.z),q=new THREE.Quaternion(t.orientation.x,t.orientation.y,t.orientation.z,t.orientation.w),dir=new THREE.Vector3(0,0,-1).applyQuaternion(q).normalize();if(dir.y>=-.025){currentFloorTarget=null;reticle.visible=false;setTarget(false);return}const dist=(floorY-origin.y)/dir.y;if(!Number.isFinite(dist)||dist<.2||dist>MAX_TARGET_DISTANCE){currentFloorTarget=null;reticle.visible=false;setTarget(false);return}const p=origin.clone().addScaledVector(dir,dist);p.y=floorY;currentFloorTarget=p;lastStableFloorTarget=p.clone();lastFloorTargetTime=performance.now();reticle.position.copy(p);reticle.visible=true;setTarget(true,dist)}
function unlockWorld(){lockedToWorld=false;anchorStatus='';anchorSuspended=false;pendingAnchorRefresh=false;if(modelAnchor){try{modelAnchor.delete?.()}catch{}modelAnchor=null}setLockLabel()}
function placeAtFloorTarget(){const p=currentStableFloorTarget();if(!model||!p){setStatus('Ținta pardoselii lipsește.');return}unlockWorld();model.position.copy(p);model.position.y=floorY;model.rotation.set(0,yaw,0);model.visible=true;mode='idle';setStatus('Pergola plasată.')}
function onSelect(){if(mode==='place')placeAtFloorTarget()}
function clearWallGeometry(){wallMarkers.forEach(m=>{scene.remove(m);m.traverse?.(c=>{c.geometry?.dispose?.();c.material?.dispose?.()})});wallMarkers=[];if(wallLine){scene.remove(wallLine);wallLine.geometry?.dispose?.();wallLine.material?.dispose?.();wallLine=null}}
function addWallMarker(p,index){const g=new THREE.Group(),col=index===0?0x42ff8a:0xffc542;const s=new THREE.Mesh(new THREE.SphereGeometry(.09,20,16),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.8,depthTest:false}));const r=new THREE.Mesh(new THREE.TorusGeometry(.13,.018,10,28).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false}));s.renderOrder=1001;r.renderOrder=1002;g.add(s,r);g.position.copy(p);g.position.y=floorY+.04;scene.add(g);wallMarkers.push(g)}
function drawWallLine(){const a=wallPoints[0].clone(),b=wallPoints[1].clone(),mid=a.clone().add(b).multiplyScalar(.5),len=a.distanceTo(b);mid.y=floorY+.025;const geo=new THREE.BoxGeometry(.035,.018,len),mat=new THREE.MeshBasicMaterial({color:0x42ff8a,depthTest:false});wallLine=new THREE.Mesh(geo,mat);wallLine.position.copy(mid);wallLine.lookAt(b.x,mid.y,b.z);wallLine.renderOrder=1000;scene.add(wallLine)}
function beginWallDefinition(){closeMore();wallPoints=[];clearWallGeometry();mode='wall';setWallStage(1);wallInfo.textContent='Țintește baza peretelui pentru P1';setStatus('Alege P1.')}
function captureWallPoint(index){if(mode!=='wall')return;const p=currentStableFloorTarget();if(!p){setStatus('Ținta pardoselii nu este disponibilă.');return}p.y=floorY;if(index===0){wallPoints=[p];clearWallGeometry();addWallMarker(p,0);setWallStage(2);wallInfo.textContent='P1 ✓ · mută ținta lateral pentru P2';setStatus('P1 setat.');return}const a=wallPoints[0],len=Math.hypot(p.x-a.x,p.z-a.z);if(len<.30){setStatus('P2 prea aproape de P1.');return}wallPoints[1]=p;addWallMarker(p,1);drawWallLine();mode='idle';setWallStage(3);wallInfo.textContent=`P1 ✓  P2 ✓  · ${len.toFixed(2)} m`;setStatus('P1/P2 setate.')}
function snapToWall(){if(!model||wallPoints.length!==2){setStatus('Peretele nu este definit complet.');return}const a=wallPoints[0],b=wallPoints[1],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);let ux=dx/len,uz=dz/len;const mx=(a.x+b.x)/2,mz=(a.z+b.z)/2,xrCam=renderer.xr.getCamera(camera),camPos=new THREE.Vector3();xrCam.getWorldPosition(camPos);let nx=-uz,nz=ux;if((camPos.x-mx)*nx+(camPos.z-mz)*nz<0){ux=-ux;uz=-uz}yaw=normalizeRad(Math.atan2(-uz,ux));model.rotation.set(0,yaw,0);model.position.set(mx-ux*(WIDTH/2),floorY,mz-uz*(WIDTH/2));model.visible=true;mode='locked';lockedToWorld=true;anchorStatus='local-floor';setWallStage(4);wallInfo.textContent='SNAP + LOCK ✓';setLockLabel();scheduleRelock();setStatus('Pergola blocată în spațiu.')}
function scheduleRelock(){if(!lockedToWorld)return;pendingAnchorRefresh=true;anchorSuspended=true;anchorStatus='relock…';setLockLabel()}
async function refreshAnchor(frame){if(!lockedToWorld||!pendingAnchorRefresh||anchorRefreshInFlight||!frame||!refSpace||typeof frame.createAnchor!=='function')return;anchorRefreshInFlight=true;pendingAnchorRefresh=false;try{const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),yaw);const tr=new XRRigidTransform({x:model.position.x,y:floorY,z:model.position.z,w:1},{x:q.x,y:q.y,z:q.z,w:q.w});const a=await frame.createAnchor(tr,refSpace);if(modelAnchor){try{modelAnchor.delete?.()}catch{}}modelAnchor=a;anchorStatus='XRAnchor ✓';anchorSuspended=false;setLockLabel()}catch(e){anchorStatus='local-floor fallback';anchorSuspended=false;setLockLabel()}finally{anchorRefreshInFlight=false}}
function applyAnchorPose(frame){if(!lockedToWorld||anchorSuspended||!modelAnchor||!refSpace)return;const p=frame.getPose(modelAnchor.anchorSpace,refSpace);if(!p)return;model.position.set(p.transform.position.x,p.transform.position.y,p.transform.position.z);model.quaternion.set(p.transform.orientation.x,p.transform.orientation.y,p.transform.orientation.z,p.transform.orientation.w)}
function changeHeight(delta){heightOffset=THREE.MathUtils.clamp(heightOffset+delta,-.60,.80);buildModelGeometry();setStatus(`H ${delta>0?'+':'−'}5 cm.`)}
function setFabric(pct){fabricPct=THREE.MathUtils.clamp(Math.round(pct/5)*5,0,100);fabricRange.value=fabricPct;buildModelGeometry();setStatus(`Stofă ${fabricPct}%.`)}
function toggleLed(){ledOn=!ledOn;buildModelGeometry();setStatus('LED '+(ledOn?'ON':'OFF'))}
async function startXR(){start.disabled=true;setStatus('Pornire WebXR…');try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test','local-floor'],optionalFeatures:['dom-overlay','anchors'],domOverlay:{root:document.body}});renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(session);refSpace=await session.requestReferenceSpace('local-floor');viewerSpace=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:viewerSpace});floorY=0;floorLocked=true;setFloorLabel();setLockLabel();session.addEventListener('select',onSelect);session.addEventListener('end',()=>{unlockWorld();controls.classList.remove('active');start.style.display='inline-block';start.disabled=false;reticle.visible=false;currentFloorTarget=null;lastStableFloorTarget=null;floorLocked=false;setFloorLabel();setTarget(false);setWallStage(0);closeMore();setStatus('WebXR închis.')});controls.classList.add('active');start.style.display='none';mode=model?.visible?'idle':'place';setWallStage(0);closeMore();setStatus('Țintește podeaua și atinge ecranul pentru plasare.');renderer.setAnimationLoop(render)}catch(e){setStatus('Pornire eșuată: '+(e?.message||e));start.disabled=false}}
function render(_t,frame){latestFrame=frame||latestFrame;if(frame&&refSpace){updateFloorTarget(frame);applyAnchorPose(frame);refreshAnchor(frame)}renderer.render(scene,camera)}
start.addEventListener('click',startXR);moreToggle.onclick=toggleMore;document.getElementById('horizon').onclick=()=>{if(model){model.rotation.x=0;model.rotation.z=0;if(lockedToWorld)scheduleRelock();setStatus('Orizont aplicat.')}};document.getElementById('flip').onclick=()=>applyYaw(yaw+Math.PI);document.getElementById('coarseLeft').onclick=()=>applyYaw(yaw+THREE.MathUtils.degToRad(15));document.getElementById('coarseRight').onclick=()=>applyYaw(yaw-THREE.MathUtils.degToRad(15));document.getElementById('replace').onclick=()=>{unlockWorld();mode='place';closeMore();setStatus('Reașezare: țintește podeaua și atinge ecranul.')};document.getElementById('moveLeft').onclick=()=>worldMove(-MOVE_STEP,0);document.getElementById('moveRight').onclick=()=>worldMove(MOVE_STEP,0);document.getElementById('moveForward').onclick=()=>worldMove(0,MOVE_STEP);document.getElementById('moveBack').onclick=()=>worldMove(0,-MOVE_STEP);document.getElementById('fineLeft').onclick=()=>applyYaw(yaw+FINE_ROTATE_STEP);document.getElementById('fineRight').onclick=()=>applyYaw(yaw-FINE_ROTATE_STEP);document.getElementById('heightUp').onclick=()=>changeHeight(HEIGHT_STEP);document.getElementById('heightDown').onclick=()=>changeHeight(-HEIGHT_STEP);fabricRange.addEventListener('input',e=>setFabric(Number(e.target.value)));document.getElementById('fabricOpen').onclick=()=>setFabric(100);document.getElementById('fabricClose').onclick=()=>setFabric(0);ledToggle.onclick=toggleLed;wallAction.onclick=()=>{if(wallStage===0||wallStage===4)beginWallDefinition();else if(wallStage===1)captureWallPoint(0);else if(wallStage===2)captureWallPoint(1);else if(wallStage===3)snapToWall()};addEventListener('resize',()=>renderer?.setSize(innerWidth,innerHeight));
setStatus('Inițializare P0.8…');initScene();checkXR();
</script>
</body></html>
